services:
  mysql:
    image: mysql:8.4
    container_name: lab3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lab3pass
      MYSQL_DATABASE: lab3_db
    ports:
      - "3306:3306"
    volumes:
      - lab3-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plab3pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lab3-mysql-data:
